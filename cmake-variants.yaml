        BUILD_WITH_ASAN: OFF
        BUILD_WITH_UBSAN: OFF
        BUILD_WITH_COVERAGE: ON
        BUILD_WITH_PROFILER: ON
        BUILD_WITH_PEDANTIC: OFF
    pedantic:
      short: Pedantic
      long: Pedantic Building
      buildType: Release
      settings: 
        BUILD_WITH_ASAN: OFF
        BUILD_WITH_UBSAN: OFF
        BUILD_WITH_TSAN: OFF
        BUILD_WITH_PEDANTIC: ON
        BUILD_WITH_COVERAGE: OFF
        BUILD_WITH_PROFILER: OFF
linkage:
  default: static
  choices:
    shared:
      short: Shared
      long: Create shared libraries/DLLs
      linkage: shared
    static:
      short: Static
      long: Create static libraries
      linkage: static