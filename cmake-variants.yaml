buildType:
  default: debug
  choices:
    debug:
      short: Debug
      long: Emit debug information
      buildType: Debug
      settings: 
        BUILD_WITH_ASAN: OFF
        BUILD_WITH_UBSAN: OFF
        BUILD_WITH_TSAN: OFF
        BUILD_WITH_PEDANTIC: OFF
        BUILD_WITH_COVERAGE: OFF
        BUILD_WITH_PROFILER: OFF
    release:
      short: Release
      long: Optimize generated code
      buildType: Release
      settings: 
        BUILD_WITH_ASAN: OFF
        BUILD_WITH_UBSAN: OFF
        BUILD_WITH_TSAN: OFF
        BUILD_WITH_PEDANTIC: OFF
        BUILD_WITH_COVERAGE: OFF
        BUILD_WITH_PROFILER: OFF
    releasedebug:
      short: RelWithDebInfo
      long: Optimize generated code and Debug
      buildType: RelWithDebInfo
      settings: 
        BUILD_WITH_ASAN: OFF
        BUILD_WITH_UBSAN: OFF
        BUILD_WITH_TSAN: OFF
        BUILD_WITH_PEDANTIC: OFF
        BUILD_WITH_COVERAGE: OFF
        BUILD_WITH_PROFILER: OFF
    asan:
      short: Asan
      long: Instrument with Address Sanitizer
      buildType: Debug
      settings: 
        BUILD_WITH_ASAN: ON
